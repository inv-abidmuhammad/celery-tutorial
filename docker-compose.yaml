services:

  redis:
    image: redis:latest
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  web:
    build:
      context: ./async-document-processor
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ./async-document-processor/.env
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1

  worker:
    build:
      context: ./async-document-processor
      dockerfile: Dockerfile
    env_file:
      - ./async-document-processor/.env
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    command: celery -A config worker --loglevel=INFO
    depends_on:
      redis:
        condition: service_healthy

  beat:
    build:
      context: ./async-document-processor
      dockerfile: Dockerfile
    env_file:
      - ./async-document-processor/.env
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    command: celery -A config beat --loglevel=INFO
    depends_on:
      redis:
        condition: service_healthy



volumes:
  redis_data: